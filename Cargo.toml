[workspace]
resolver = "2"
members = ["agent", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

# Dépendances partagées entre le crate `agent` (logique) et le crate
# `desktop/src-tauri` (application Tauri). Les versions sont centralisées ici
# pour éviter les divergences.
[workspace.dependencies]
jimmy-agent = { path = "agent" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
hound = "3.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true